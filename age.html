<!DOCTYPE html>
<html>
<head>
<title>Age Calculator - CalculatorMaster</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f7fb;padding:40px}
.box{background:white;padding:25px;border-radius:15px;max-width:400px;margin:auto}
input,button{padding:12px;margin:10px;width:90%}
button{background:#2563eb;color:white;border:0;border-radius:8px}
</style>
</head>
<body>

<div class="box">
<h1>Age Calculator</h1>
<p>Enter your Date of Birth</p>

<input type="date" id="dob">
<button onclick="calculateAge()">Calculate Age</button>

<h2 id="result"></h2>
</div>

<script>
function calculateAge(){
let dob=new Date(document.getElementById("dob").value);
let today=new Date();

if(!document.getElementById("dob").value){
document.getElementById("result").innerText="Please enter your DOB";
return;
}

let age=today.getFullYear()-dob.getFullYear();
let m=today.getMonth()-dob.getMonth();

if(m<0 || (m===0 && today.getDate()<dob.getDate())) age--;

document.getElementById("result").innerText="Your Age is "+age+" years";
}
</script>

</body>
</html>
