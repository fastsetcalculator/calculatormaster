<!DOCTYPE html>
<html>
<head>
<title>Age Calculator - CalculatorMaster</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f7fb;padding:40px}
.box{background:white;padding:25px;border-radius:15px;max-width:400px;margin:auto}
input,button{padding:12px;margin:10px;width:90%;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:8px}
</style>
</head>
<body>

<div class="box">
<h1>Age Calculator</h1>
<p>Enter your Date of Birth</p>

<input type="date" id="dob">
<button onclick="calculateAge()">Calculate Age</button>

<h2 id="result"></h2>
<p id="days"></p>
</div>

<script>
function calculateAge(){
let dob=new Date(document.getElementById("dob").value);
let today=new Date();

if(!document.getElementById("dob").value){
document.getElementById("result").innerText="Please enter your DOB";
return;
}

let years=today.getFullYear()-dob.getFullYear();
let months=today.getMonth()-dob.getMonth();
let day=today.getDate()-dob.getDate();

if(day<0){
months--;
day+=new Date(today.getFullYear(),today.getMonth(),0).getDate();
}

if(months<0){
years--;
months+=12;
}

let totalDays=Math.floor((today-dob)/(1000*60*60*24));

document.getElementById("result").innerText=
"Your Age: "+years+" Years "+months+" Months "+day+" Days";

document.getElementById("days").innerText=
"Total Days: "+totalDays+" Days";
}
</script>

</body>
</html>
